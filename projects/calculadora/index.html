<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>

        <div class="visor" aria-live="polite">
            <div class="historico" id="historico"></div>
            <div class="resultado" id="resultado">0</div>
        </div>

        <div class="teclas">
            <button class="limpar" data-acao="limpar">C</button>
            <button class="apagar" data-acao="apagar" aria-label="Apagar">&#9003;</button>
            <button class="operador" data-op="%">%</button>
            <button class="operador" data-op="/">&divide;</button>

            <button data-num="7">7</button>
            <button data-num="8">8</button>
            <button data-num="9">9</button>
            <button class="operador" data-op="*">&times;</button>

            <button data-num="4">4</button>
            <button data-num="5">5</button>
            <button data-num="6">6</button>
            <button class="operador" data-op="-">&minus;</button>

            <button data-num="1">1</button>
            <button data-num="2">2</button>
            <button data-num="3">3</button>
            <button class="operador" data-op="+">+</button>

            <button class="zero" data-num="0">0</button>
            <button data-acao="ponto">,</button>
            <button class="igual" data-acao="igual">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
