<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tela do projeto Calculadora">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
  </style>
  <rect width="320" height="200" fill="#f2f2f2"/>
  <rect x="60" y="-10" width="200" height="220" rx="4" fill="#ffffff" filter="url(#sombra)"/>
  <text x="160" y="30" font-size="16" font-weight="700" fill="#000" text-anchor="middle">Calculadora</text>
  <rect x="72" y="38" width="176" height="36" rx="4" fill="#f4f4f4" stroke="#c4c4c4"/>
  <text x="240" y="53" font-size="8" fill="#757575" text-anchor="end">12 × 8</text>
  <text x="240" y="69" font-size="16" font-weight="700" fill="#000" text-anchor="end">96</text>
  <g>
    <rect x="72"  y="82" width="38" height="20" rx="3" fill="#dc3545"/>
    <rect x="114" y="82" width="38" height="20" rx="3" fill="#dc3545"/>
    <rect x="156" y="82" width="38" height="20" rx="3" fill="#28a745"/>
    <rect x="198" y="82" width="50" height="20" rx="3" fill="#28a745"/>
    <rect x="72"  y="106" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="114" y="106" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="156" y="106" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="198" y="106" width="50" height="20" rx="3" fill="#28a745"/>
    <rect x="72"  y="130" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="114" y="130" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="156" y="130" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="198" y="130" width="50" height="20" rx="3" fill="#28a745"/>
    <rect x="72"  y="154" width="80" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="156" y="154" width="38" height="20" rx="3" fill="#f4f4f4" stroke="#ccc"/>
    <rect x="198" y="154" width="50" height="20" rx="3" fill="#28a745"/>
  </g>
  <g font-size="10" font-weight="700" text-anchor="middle" fill="#fff">
    <text x="91" y="96">C</text><text x="133" y="96">⌫</text><text x="175" y="96">%</text><text x="223" y="96">÷</text>
    <text x="223" y="120">×</text><text x="223" y="144">−</text><text x="223" y="168">=</text>
  </g>
  <g font-size="10" font-weight="700" text-anchor="middle" fill="#222">
    <text x="91" y="120">7</text><text x="133" y="120">8</text><text x="175" y="120">9</text>
    <text x="91" y="144">4</text><text x="133" y="144">5</text><text x="175" y="144">6</text>
    <text x="112" y="168">0</text><text x="175" y="168">,</text>
  </g>
</svg>
